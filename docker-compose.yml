services:
  postgres:
    image: postgres:16
    container_name: industrial-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: industrial_platform
      POSTGRES_USER: industrial_platform
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: industrial-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/IndustrialPlatform.Api/Dockerfile
    container_name: industrial-platform-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=industrial_platform;Username=industrial_platform;Password=changeme"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5000:8080"

# یادداشت: در محیط Kubernetes، این سرویس‌ها با Deployment/Service/ConfigMap/Secret معادل
# جایگزین می‌شوند (سند 01-Architecture.md بخش ۵) — این فایل صرفاً برای توسعه محلی است.
